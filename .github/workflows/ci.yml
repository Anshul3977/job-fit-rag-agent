name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install
        run: pip install -r requirements.txt -r requirements-dev.txt
      - name: Ruff
        run: |
          ruff check .
          ruff format --check .
      - name: Pytest
        run: pytest -q

  eval-gate:
    # Regression gate on the labeled synthetic sets, with the real MiniLM embeddings.
    runs-on: ubuntu-latest
    needs: test
    env:
      EMBEDDING_CACHE_DIR: ${{ github.workspace }}/data/models
      HF_HUB_DISABLE_PROGRESS_BARS: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install
        run: pip install -r requirements.txt -r requirements-dev.txt
      - name: Cache embedding and reranker models
        uses: actions/cache@v4
        with:
          path: data/models
          key: models-minilm-l6-msmarco-l6-v1
      - name: Fit eval (deterministic scorer) + gate
        run: |
          EVAL_OUT_DIR=/tmp/eval python eval/run_eval.py
          python eval/gate.py /tmp/eval/results.json
      - name: Retrieval benchmark (Recall@k, MRR) floor
        run: python eval/retrieval_eval.py --check --no-write
      - name: Prompt-injection set floor
        run: python eval/injection_eval.py --check --no-write

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run build

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build image
        run: docker build -t job-fit-rag-agent .
